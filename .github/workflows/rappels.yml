name: Rappels Lockin

on:
  schedule:
    - cron: '7 * * * *'   # chaque heure
  workflow_dispatch:
    inputs:
      kind:
        description: 'test = notif test · gym = arrivée au gym'
        type: choice
        options: [test, gym]
        default: test

jobs:
  rappels:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save --no-audit --no-fund web-push@3.6.7
      - run: node scripts/rappels.mjs
        env:
          LOCKIN_EMAIL: ${{ secrets.LOCKIN_EMAIL }}
          LOCKIN_PASSWORD: ${{ secrets.LOCKIN_PASSWORD }}
          KIND: ${{ github.event.inputs.kind }}
